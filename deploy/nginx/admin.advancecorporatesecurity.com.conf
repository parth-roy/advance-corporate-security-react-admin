# Nginx Reverse Proxy — ACS Admin Panel (admin.advancecorporatesecurity.com)
# Place at: /etc/nginx/sites-available/admin.advancecorporatesecurity.com
# Symlink:  sudo ln -s /etc/nginx/sites-available/admin.advancecorporatesecurity.com /etc/nginx/sites-enabled/
# Then run: sudo nginx -t && sudo systemctl reload nginx
# SSL:      sudo certbot --nginx -d admin.advancecorporatesecurity.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.advancecorporatesecurity.com;

    # Prevent search engines from indexing internal admin panel
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Cache immutable hashed static assets emitted by Vite/Nitro
    location /assets/ {
        proxy_pass http://127.0.0.1:7967;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:7967;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
